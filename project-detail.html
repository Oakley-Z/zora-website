<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zora project detail page." />
    <title>Zora | Project Detail</title>
    <link rel="icon" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="cursor-light" aria-hidden="true"></div>

    <main class="site-shell detail-shell">
      <section class="detail-hero">
        <div class="language-switcher fade-in" aria-label="Language">
          <button class="lang-button" data-lang="zh-CN">简体中文</button>
          <button class="lang-button" data-lang="zh-HK">繁體中文</button>
          <button class="lang-button" data-lang="en">English</button>
        </div>

        <nav class="hero-nav fade-in" aria-label="Primary">
          <a href="index.html#about" data-i18n="navAbout">关于我</a>
          <a href="index.html#services" data-i18n="navSkills">我的技能</a>
          <a href="index.html#projects" data-i18n="navProjects">我的项目</a>
          <a href="index.html#picks" data-i18n="navPicks">我的推荐</a>
          <a href="index.html#contact" data-i18n="navContact">联系我</a>
        </nav>

        <div class="detail-layout fade-in">
          <div class="detail-copy">
            <a class="detail-back" href="index.html#projects" aria-label="返回项目" title="返回项目">
              <span aria-hidden="true">←</span>
            </a>
            <p class="detail-kicker" data-i18n="detailKicker">Project Detail</p>
            <h1 class="hero-heading" id="detailTitle">个人网站</h1>
            <p class="detail-tagline" id="detailTagline">我的第一个Vibe Coding作品</p>
          </div>

          <div class="detail-media-grid" id="detailImages" aria-label="Project images"></div>
        </div>
      </section>

      <section class="detail-content reveal">
        <article class="detail-panel">
          <span>01</span>
          <h2 data-i18n="whatLabel">这是什么项目</h2>
          <p id="detailWhat"></p>
        </article>

        <article class="detail-panel">
          <span>02</span>
          <h2 data-i18n="whyLabel">为什么做</h2>
          <p id="detailWhy"></p>
        </article>

        <article class="detail-panel">
          <span>03</span>
          <h2 data-i18n="stackLabel">技术栈</h2>
          <ul id="detailStack"></ul>
        </article>

        <a class="contact-button detail-code-button" id="codeButton" href="#" target="_blank" rel="noopener noreferrer" data-i18n="codeButton">代码</a>
      </section>
    </main>

    <footer class="site-footer">
      <span>© 2026 Zora</span>
      <span>Personal Brand + Portfolio + Product Lab + AI Studio</span>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="project-detail.js"></script>
  </body>
</html>
